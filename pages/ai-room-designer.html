<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interior Design Generator | Ajor Interio</title>
  <link rel="icon" href="../images/logo.png" type="image/png" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --ai-navy: #182b58;
      --ai-pink: #ef4f76;
      --ai-blue: #208fc8;
      --ai-soft: #eef5ff;
      --ai-line: rgba(108, 154, 225, 0.2);
    }

    body {
      background: #f8fbff;
      color: var(--ai-navy);
    }

    .ai-page {
      overflow: hidden;
    }

    .ai-hero {
      position: relative;
      min-height: 520px;
      display: grid;
      place-items: center;
      padding: 72px 20px 110px;
      background:
        radial-gradient(circle at 50% 100%, rgba(239, 79, 118, 0.16), transparent 28%),
        linear-gradient(180deg, #f3f8ff 0%, #eef5ff 100%);
      text-align: center;
      isolation: isolate;
    }

    .ai-hero::before,
    .ai-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .ai-hero::before {
      opacity: 0.95;
      background-image:
        repeating-radial-gradient(ellipse 460px 120px at 8% 78%, transparent 0 16px, var(--ai-line) 17px 18px),
        repeating-radial-gradient(ellipse 520px 150px at 38% 82%, transparent 0 16px, rgba(117, 156, 225, 0.18) 17px 18px),
        repeating-radial-gradient(ellipse 720px 120px at 78% 86%, transparent 0 17px, rgba(117, 156, 225, 0.17) 18px 19px);
      transform: scaleX(1.1);
    }

    .ai-hero::after {
      opacity: 0.72;
      background-image:
        repeating-radial-gradient(ellipse 720px 140px at 90% 68%, transparent 0 15px, rgba(117, 156, 225, 0.18) 16px 17px),
        repeating-radial-gradient(ellipse 560px 120px at -4% 67%, transparent 0 16px, rgba(117, 156, 225, 0.16) 17px 18px);
    }

    .ai-hero-inner {
      width: min(100%, 1320px);
      margin: 0 auto;
    }

    .ai-hero h1 {
      margin: 0;
      color: var(--ai-navy);
      font-size: clamp(3rem, 7.2vw, 6.6rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: 0;
    }

    .ai-hero h1 span {
      background: linear-gradient(135deg, #a84def 5%, #ff2f83 54%, #ff7d45 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .ai-hero p {
      margin: 34px auto 32px;
      max-width: 1080px;
      color: #4d5668;
      font-size: clamp(1rem, 1.55vw, 1.55rem);
      line-height: 1.5;
    }

    .ai-hero-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 54px;
      padding: 0 30px;
      border-radius: 12px;
      background: var(--ai-pink);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 16px 34px rgba(239, 79, 118, 0.3);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .ai-hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 42px rgba(239, 79, 118, 0.36);
    }

    .ai-ginie {
      position: absolute;
      right: 0;
      bottom: 120px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ai-ginie-close {
      position: absolute;
      top: -8px;
      left: -12px;
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #1b1b1b;
      font-size: 13px;
      line-height: 1;
      box-shadow: 0 5px 14px rgba(23, 36, 71, 0.12);
    }

    .ai-ginie-label {
      padding: 9px 12px;
      border-radius: 5px;
      background: #fff;
      color: #2d2d2d;
      font-weight: 800;
      box-shadow: 0 9px 20px rgba(23, 36, 71, 0.12);
    }

    .ai-ginie-icon {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 14px 0 0 14px;
      background: linear-gradient(135deg, #a852e7 0%, #229bd2 100%);
      color: #fff;
      font-size: 31px;
      font-weight: 900;
      box-shadow: 0 16px 28px rgba(32, 143, 200, 0.32);
    }

    @media (max-width: 980px) {
      .ai-hero {
        min-height: 460px;
        padding-top: 58px;
      }

      .ai-ginie {
        display: none;
      }
    }

    @media (max-width: 640px) {
      .ai-hero {
        min-height: 420px;
        padding: 56px 16px 82px;
      }

      .ai-hero p {
        margin-top: 22px;
      }

      .ai-hero-cta {
        width: 100%;
        max-width: 280px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="nav-main">
      <div class="container nav-inner">
        <a href="../index.html" class="brand-logo">
          <img src="../images/logo.png" alt="Ajor logo" />
        </a>
        <a href="../index.html" class="btn btn-primary nav-cta">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="ai-page">
    <section class="ai-hero">
      <div class="ai-hero-inner">
        <h1><span>AI</span> Interior Design Generator</h1>
        <p>Upload a photo of your room and watch it transform into your dream space with our AI-powered interior design tools</p>
        <a class="ai-hero-cta" href="../index.html#lead-form">Design My Home <span aria-hidden="true">-&gt;</span></a>
      </div>

   
    </section>
  </main>

</body>

</html>
