<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Interior Design Generator | Ajor Interio</title>
  <link rel="icon" href="../images/logo.png" type="image/png" />
  <link rel="stylesheet" href="../style.css" />
  <style>
    :root {
      --ai-navy: #182b58;
      --ai-pink: #ef4f76;
      --ai-blue: #208fc8;
      --ai-soft: #eef5ff;
      --ai-line: rgba(108, 154, 225, 0.2);
    }

    body {
      background: #f8fbff;
      color: var(--ai-navy);
    }

    .ai-page {
      overflow: hidden;
    }

    .ai-hero {
      position: relative;
      min-height: 520px;
      display: grid;
      place-items: center;
      padding: 72px 20px 110px;
      background:
        radial-gradient(circle at 50% 100%, rgba(239, 79, 118, 0.16), transparent 28%),
        linear-gradient(180deg, #f3f8ff 0%, #eef5ff 100%);
      text-align: center;
      isolation: isolate;
    }

    .ai-hero::before,
    .ai-hero::after {
      content: "";
      position: absolute;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      background-repeat: no-repeat;
      background-size: 100% 100%;
    }

    .ai-hero::before {
      opacity: 0.95;
      background-image:
        repeating-radial-gradient(ellipse 460px 120px at 8% 78%, transparent 0 16px, var(--ai-line) 17px 18px),
        repeating-radial-gradient(ellipse 520px 150px at 38% 82%, transparent 0 16px, rgba(117, 156, 225, 0.18) 17px 18px),
        repeating-radial-gradient(ellipse 720px 120px at 78% 86%, transparent 0 17px, rgba(117, 156, 225, 0.17) 18px 19px);
      transform: scaleX(1.1);
    }

    .ai-hero::after {
      opacity: 0.72;
      background-image:
        repeating-radial-gradient(ellipse 720px 140px at 90% 68%, transparent 0 15px, rgba(117, 156, 225, 0.18) 16px 17px),
        repeating-radial-gradient(ellipse 560px 120px at -4% 67%, transparent 0 16px, rgba(117, 156, 225, 0.16) 17px 18px);
    }

    .ai-hero-inner {
      width: min(100%, 1320px);
      margin: 0 auto;
    }

    .ai-hero h1 {
      margin: 0;
      color: var(--ai-navy);
      font-size: clamp(3rem, 7.2vw, 6.6rem);
      font-weight: 800;
      line-height: 1.02;
      letter-spacing: 0;
    }

    .ai-hero h1 span {
      background: linear-gradient(135deg, #a84def 5%, #ff2f83 54%, #ff7d45 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .ai-hero p {
      margin: 34px auto 32px;
      max-width: 1080px;
      color: #4d5668;
      font-size: clamp(1rem, 1.55vw, 1.55rem);
      line-height: 1.5;
    }

    .ai-hero-cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      min-height: 54px;
      padding: 0 30px;
      border-radius: 12px;
      background: var(--ai-pink);
      color: #fff;
      font-size: 1.15rem;
      font-weight: 700;
      box-shadow: 0 16px 34px rgba(239, 79, 118, 0.3);
      transition: transform 180ms ease, box-shadow 180ms ease;
    }

    .ai-hero-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 20px 42px rgba(239, 79, 118, 0.36);
    }

    .ai-ginie {
      position: absolute;
      right: 0;
      bottom: 120px;
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ai-ginie-close {
      position: absolute;
      top: -8px;
      left: -12px;
      width: 19px;
      height: 19px;
      display: grid;
      place-items: center;
      border-radius: 50%;
      background: #fff;
      color: #1b1b1b;
      font-size: 13px;
      line-height: 1;
      box-shadow: 0 5px 14px rgba(23, 36, 71, 0.12);
    }

    .ai-ginie-label {
      padding: 9px 12px;
      border-radius: 5px;
      background: #fff;
      color: #2d2d2d;
      font-weight: 800;
      box-shadow: 0 9px 20px rgba(23, 36, 71, 0.12);
    }

    .ai-ginie-icon {
      width: 60px;
      height: 60px;
      display: grid;
      place-items: center;
      border-radius: 14px 0 0 14px;
      background: linear-gradient(135deg, #a852e7 0%, #229bd2 100%);
      color: #fff;
      font-size: 31px;
      font-weight: 900;
      box-shadow: 0 16px 28px rgba(32, 143, 200, 0.32);
    }

    .ai-designer {
      padding: 70px 0 90px;
      background: #fff;
    }

    .ai-designer-head {
      max-width: 760px;
      margin-bottom: 34px;
    }

    .ai-designer-head h2 {
      margin: 0 0 12px;
      color: var(--ai-navy);
      font-size: clamp(2rem, 4vw, 3.35rem);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .ai-designer-head p {
      margin: 0;
      color: #606b7d;
      font-size: 1.06rem;
      line-height: 1.7;
    }

    .ai-tool-grid {
      display: grid;
      grid-template-columns: minmax(300px, 430px) minmax(0, 1fr);
      gap: 28px;
      align-items: stretch;
    }

    .ai-panel,
    .ai-preview {
      border: 1px solid #e4ebf7;
      border-radius: 18px;
      background: #fff;
      box-shadow: 0 24px 70px rgba(24, 43, 88, 0.08);
    }

    .ai-panel {
      padding: 24px;
    }

    .ai-panel-title {
      margin: 0 0 14px;
      color: var(--ai-navy);
      font-size: 1rem;
      font-weight: 800;
    }

    .ai-upload {
      position: relative;
      min-height: 178px;
      display: grid;
      place-items: center;
      gap: 10px;
      margin-bottom: 24px;
      padding: 24px;
      border: 2px dashed #c7d6ee;
      border-radius: 16px;
      background: #f8fbff;
      text-align: center;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease;
    }

    .ai-upload:hover {
      border-color: var(--ai-pink);
      background: #fff6f9;
    }

    .ai-upload strong {
      color: var(--ai-navy);
      font-size: 1.05rem;
    }

    .ai-upload span {
      color: #6b7486;
      font-size: 0.92rem;
    }

    .ai-upload input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
    }

    .ai-options {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
      margin-bottom: 22px;
    }

    .ai-option {
      min-height: 48px;
      border: 1px solid #e3eaf6;
      border-radius: 12px;
      background: #fbfdff;
      color: #233865;
      font-weight: 800;
      cursor: pointer;
      transition: border-color 180ms ease, background 180ms ease, color 180ms ease;
    }

    .ai-option:hover,
    .ai-option.active {
      border-color: var(--ai-pink);
      background: #fff0f4;
      color: var(--ai-pink);
    }

    .ai-colors {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    .ai-color {
      width: 44px;
      height: 44px;
      border: 3px solid #fff;
      border-radius: 50%;
      box-shadow: 0 0 0 1px #d7e1ef, 0 8px 18px rgba(24, 43, 88, 0.12);
      cursor: pointer;
    }

    .ai-color.active {
      box-shadow: 0 0 0 3px var(--ai-pink), 0 10px 20px rgba(239, 79, 118, 0.22);
    }

    .ai-preview {
      position: relative;
      min-height: 650px;
      overflow: hidden;
      --accent: #f7f3ea;
      --accent-rgb: 247, 243, 234;
    }

    .ai-preview img {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .ai-preview-design {
      position: absolute;
      inset: 0;
      background: linear-gradient(120deg, rgba(var(--accent-rgb), 0.32), rgba(var(--accent-rgb), 0.08));
      mix-blend-mode: color;
      pointer-events: none;
    }

    .ai-preview-design::before,
    .ai-preview-design::after {
      content: "";
      position: absolute;
      left: 9%;
      right: 9%;
      border-radius: 12px;
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.26), transparent 34%),
        repeating-linear-gradient(90deg, rgba(var(--accent-rgb), 0.9) 0 19%, rgba(255, 255, 255, 0.16) 19% 19.8%, rgba(var(--accent-rgb), 0.72) 19.8% 38%);
      box-shadow: 0 22px 60px rgba(0, 0, 0, 0.18);
      mix-blend-mode: overlay;
      opacity: 0.76;
    }

    .ai-preview-design::before {
      top: 12%;
      height: 18%;
    }

    .ai-preview-design::after {
      bottom: 15%;
      height: 23%;
    }

    .ai-preview[data-room="bedroom"] .ai-preview-design::before {
      top: 17%;
      left: 14%;
      right: 14%;
      height: 12%;
    }

    .ai-preview[data-room="bedroom"] .ai-preview-design::after {
      bottom: 11%;
      height: 30%;
    }

    .ai-preview[data-room="living room"] .ai-preview-design::before {
      top: auto;
      bottom: 42%;
      height: 10%;
      left: 16%;
      right: 16%;
    }

    .ai-preview[data-room="living room"] .ai-preview-design::after {
      bottom: 16%;
      height: 15%;
    }

    .ai-preview[data-room="wardrobe"] .ai-preview-design::before {
      top: 13%;
      bottom: 13%;
      height: auto;
      left: 13%;
      right: 13%;
    }

    .ai-preview[data-room="wardrobe"] .ai-preview-design::after {
      display: none;
    }

    .ai-preview[data-material="acrylic"] .ai-preview-design::before,
    .ai-preview[data-material="acrylic"] .ai-preview-design::after {
      background:
        linear-gradient(120deg, rgba(255, 255, 255, 0.5), transparent 26%, rgba(255, 255, 255, 0.18) 52%, transparent 76%),
        repeating-linear-gradient(90deg, rgba(var(--accent-rgb), 0.94) 0 20%, rgba(255, 255, 255, 0.2) 20% 20.8%, rgba(var(--accent-rgb), 0.78) 20.8% 40%);
    }

    .ai-preview[data-material="pu finish"] .ai-preview-design::before,
    .ai-preview[data-material="pu finish"] .ai-preview-design::after {
      background: linear-gradient(135deg, rgba(var(--accent-rgb), 0.94), rgba(var(--accent-rgb), 0.62));
    }

    .ai-preview[data-material="veneer"] .ai-preview-design::before,
    .ai-preview[data-material="veneer"] .ai-preview-design::after {
      background:
        linear-gradient(135deg, rgba(255, 255, 255, 0.12), transparent 34%),
        repeating-linear-gradient(100deg, rgba(var(--accent-rgb), 0.9) 0 14px, rgba(82, 53, 30, 0.22) 14px 18px, rgba(var(--accent-rgb), 0.7) 18px 34px);
    }

    .ai-preview-copy {
      position: absolute;
      left: 24px;
      right: 24px;
      bottom: 24px;
      padding: 18px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      color: var(--ai-navy);
      box-shadow: 0 18px 46px rgba(24, 43, 88, 0.16);
      backdrop-filter: blur(14px);
    }

    .ai-preview-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 10px;
    }

    .ai-preview-tags span {
      padding: 6px 10px;
      border-radius: 999px;
      background: #eef4ff;
      color: #233865;
      font-size: 0.82rem;
      font-weight: 800;
    }

    .ai-preview-copy h3 {
      margin: 0 0 6px;
      font-size: 1.35rem;
    }

    .ai-preview-copy p {
      margin: 0;
      color: #536075;
      line-height: 1.5;
    }

    @media (max-width: 980px) {
      .ai-hero {
        min-height: 460px;
        padding-top: 58px;
      }

      .ai-ginie {
        display: none;
      }

      .ai-tool-grid {
        grid-template-columns: 1fr;
      }

      .ai-preview {
        min-height: 520px;
      }
    }

    @media (max-width: 640px) {
      .ai-hero {
        min-height: 420px;
        padding: 56px 16px 82px;
      }

      .ai-hero p {
        margin-top: 22px;
      }

      .ai-hero-cta {
        width: 100%;
        max-width: 280px;
      }

      .ai-options {
        grid-template-columns: 1fr;
      }

      .ai-preview {
        min-height: 430px;
      }
    }
  </style>
</head>

<body>
  <header class="site-header">
    <div class="nav-main">
      <div class="container nav-inner">
        <a href="../index.html" class="brand-logo">
          <img src="../images/logo.png" alt="Ajor logo" />
        </a>
        <a href="../index.html" class="btn btn-primary nav-cta">Back to Home</a>
      </div>
    </div>
  </header>

  <main class="ai-page">
    <section class="ai-hero">
      <div class="ai-hero-inner">
        <h1><span>AI</span> Interior Design Generator</h1>
        <p>Upload a photo of your room and watch it transform into your dream space with our AI-powered interior design tools</p>
        <a class="ai-hero-cta" href="#designer">Design My Home <span aria-hidden="true">-&gt;</span></a>
      </div>

     
    </section>

   
  </main>

  <script>
    const roomUpload = document.getElementById('roomUpload');
    const previewBox = document.getElementById('previewBox');
    const previewImage = document.getElementById('previewImage');
    const roomTag = document.getElementById('roomTag');
    const materialTag = document.getElementById('materialTag');
    const colorTag = document.getElementById('colorTag');
    const previewTitle = document.getElementById('previewTitle');
    const previewText = document.getElementById('previewText');
    let uploaded = false;

    function activeOption(group) {
      return document.querySelector(group + ' .ai-option.active');
    }

    function updatePreview() {
      const room = activeOption('.room-types');
      const material = activeOption('.materials');
      const color = document.querySelector('.ai-color.active');

      previewBox.dataset.room = room.dataset.value;
      previewBox.dataset.material = material.dataset.value;
      previewBox.style.setProperty('--accent', color.dataset.color);
      previewBox.style.setProperty('--accent-rgb', color.dataset.rgb);

      roomTag.textContent = room.textContent.trim();
      materialTag.textContent = material.textContent.trim();
      colorTag.textContent = color.dataset.name;
      previewTitle.textContent = uploaded ? 'Your Room Preview' : 'Live Interior Preview';
      previewText.textContent = uploaded
        ? room.textContent.trim() + ' preview with ' + material.textContent.trim() + ' in ' + color.dataset.name + '.'
        : 'Upload your room photo to show it here, then change material or color to update the preview.';
    }

    document.querySelectorAll('.ai-options').forEach((group) => {
      group.querySelectorAll('.ai-option').forEach((button) => {
        button.addEventListener('click', () => {
          group.querySelectorAll('.ai-option').forEach((item) => item.classList.remove('active'));
          button.classList.add('active');
          updatePreview();
        });
      });
    });

    document.querySelectorAll('.ai-color').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.ai-color').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
        updatePreview();
      });
    });

    roomUpload.addEventListener('change', (event) => {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = (readerEvent) => {
        uploaded = true;
        previewImage.src = readerEvent.target.result;
        updatePreview();
      };
      reader.readAsDataURL(file);
    });

    updatePreview();
  </script>
</body>

</html>
