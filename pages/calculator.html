<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Home Calculator | AJOR Interio</title>
  <link rel="icon" href="../images/logo.png" type="image/png" />
  <link rel="stylesheet" href="../style.css" />
</head>

<body class="home-calc-page">
  <header class="home-calc-header" aria-label="Home calculator progress">
    <a href="../index.html" class="home-calc-logo" aria-label="Back to home">
      <img src="../images/logo.png" alt="AJOR logo" />
    </a>

    <nav class="home-calc-progress" aria-label="Calculator steps">
      <div class="home-calc-step active">
        <span>1</span>
        <strong>Your Space</strong>
      </div>
      <i></i>
      <div class="home-calc-step">
        <span>2</span>
        <strong>Scope</strong>
      </div>
      <i></i>
      <div class="home-calc-step">
        <span>3</span>
        <strong>Package</strong>
      </div>
      <i></i>
      <div class="home-calc-step">
        <span>4</span>
        <strong>Estimate</strong>
      </div>
    </nav>
  </header>

  <main class="home-calc-main">
    <section class="home-calc-card home-calc-panel active" aria-labelledby="home-calc-title" data-home-calc-panel="space">
      <h1 id="home-calc-title">Your Space</h1>

      <form class="home-calc-form">
        <fieldset>
          <legend>Property Type</legend>
          <div class="home-calc-options">
            <button class="active" type="button" data-home-calc-option>Apartment</button>
            <button type="button" data-home-calc-option>Independent House/Villa</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>BHK Type / Size</legend>
          <div class="home-calc-options bhk">
            <button class="active" type="button" data-home-calc-option>1 BHK</button>
            <button type="button" data-home-calc-option>2 BHK</button>
            <button type="button" data-home-calc-option>3 BHK</button>
            <button type="button" data-home-calc-option>4 BHK</button>
          </div>
        </fieldset>

        <fieldset>
          <legend>Project Type</legend>
          <div class="home-calc-options">
            <button type="button" data-home-calc-option>New Home</button>
            <button class="active" type="button" data-home-calc-option>Renovation</button>
          </div>
        </fieldset>

        <div class="home-calc-actions">
          <button type="submit">Continue to Scope</button>
        </div>
      </form>
    </section>

    <section class="home-calc-card home-calc-panel home-calc-scope-card" aria-labelledby="home-calc-scope-title" data-home-calc-panel="scope">
      <h1 id="home-calc-scope-title">Select the rooms you'd like us to design</h1>
      <p class="home-calc-helper">To know more about this, <a href="offerings.html">click here</a></p>

      <div class="home-calc-room-list">
        <div class="home-calc-room" data-room-count>
          <strong>Living Room</strong>
          <button type="button" data-room-minus aria-label="Decrease living room">-</button>
          <span>1</span>
          <button type="button" data-room-plus aria-label="Increase living room">+</button>
        </div>

        <div class="home-calc-room" data-room-count>
          <strong>Kitchen</strong>
          <button type="button" data-room-minus aria-label="Decrease kitchen">-</button>
          <span>1</span>
          <button type="button" data-room-plus aria-label="Increase kitchen">+</button>
        </div>

        <div class="home-calc-room" data-room-count>
          <strong>Bedroom</strong>
          <button type="button" data-room-minus aria-label="Decrease bedroom">-</button>
          <span>2</span>
          <button type="button" data-room-plus aria-label="Increase bedroom">+</button>
        </div>

        <div class="home-calc-room" data-room-count>
          <strong>Bathroom</strong>
          <button type="button" data-room-minus aria-label="Decrease bathroom">-</button>
          <span>1</span>
          <button type="button" data-room-plus aria-label="Increase bathroom">+</button>
        </div>

        <div class="home-calc-room" data-room-count>
          <strong>Dining</strong>
          <button type="button" data-room-minus aria-label="Decrease dining">-</button>
          <span>1</span>
          <button type="button" data-room-plus aria-label="Increase dining">+</button>
        </div>
      </div>

      <div class="home-calc-scope-actions">
        <button class="home-calc-back" type="button" data-home-calc-back>Back</button>
        <button class="home-calc-continue" type="button" data-home-calc-scope-next>Continue to Style</button>
      </div>
    </section>

    <section class="home-calc-card home-calc-panel home-calc-package-card" aria-labelledby="home-calc-package-title" data-home-calc-panel="package">
      <h1 id="home-calc-package-title">Select Your Package</h1>

      <div class="home-calc-package-grid">
        <button class="home-calc-package-option" type="button" data-home-calc-package>
          <strong>Standard</strong>
          <img src="../images/living room design/Modern Oasis Living Room Design.jpg" alt="Standard interior package" />
          <ul>
            <li>Balanced pricing</li>
            <li>Modern layouts</li>
            <li>Modular storage</li>
          </ul>
        </button>

        <button class="home-calc-package-option" type="button" data-home-calc-package>
          <strong>Premium</strong>
          <img src="../images/living room design/Chic Contrast Open-Plan Living Room Design.jpg" alt="Premium interior package" />
          <ul>
            <li>Premium pricing</li>
            <li>Contemporary style</li>
            <li>Enhanced materials</li>
          </ul>
        </button>

        <button class="home-calc-package-option active" type="button" data-home-calc-package>
          <strong>Luxe</strong>
          <img src="../images/ajor luxe.jpg" alt="Luxe interior package" />
          <ul>
            <li>Elite pricing</li>
            <li>Lavish design</li>
            <li>Custom accessories</li>
          </ul>
        </button>
      </div>

      <div class="home-calc-package-actions">
        <button class="home-calc-back" type="button" data-home-calc-package-back>Back</button>
        <button class="home-calc-continue" type="button" data-home-calc-package-next>Continue to Estimate</button>
      </div>
    </section>

    <section class="home-calc-card home-calc-panel home-calc-estimate-card" aria-labelledby="home-calc-estimate-title" data-home-calc-panel="estimate">
      <h1 id="home-calc-estimate-title">Contact &amp; Estimate</h1>

      <form class="home-calc-estimate-form">
        <label>
          <span>Name</span>
          <input name="name" type="text" />
        </label>

        <label>
          <span>Phone Number</span>
          <input name="phone" type="tel" placeholder="Enter phone" />
        </label>

        <label>
          <span>Email</span>
          <input name="email" type="email" placeholder="you@example.com" />
        </label>

        <label>
          <span>Preferred Visit Date</span>
          <input name="visitDate" type="date" />
        </label>

        <p class="home-calc-estimate-status" aria-live="polite"></p>

        <div class="home-calc-estimate-actions">
          <button class="home-calc-back" type="button" data-home-calc-estimate-back>Back</button>
          <button class="home-calc-continue" type="submit">Get Estimate</button>
        </div>
      </form>
    </section>
  </main>

  <script src="../script.js"></script>
</body>

</html>
