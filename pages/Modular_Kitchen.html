<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="../style.css" />
  <style>
    body { margin: 0; font-family: Arial, sans-serif; background: linear-gradient(135deg, #f8f4ef, #ffffff); }
    .redirect-page { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
    .redirect-card { max-width: 620px; width: 100%; background: #fff; border-radius: 24px; padding: 32px; box-shadow: 0 20px 60px rgba(0,0,0,.12); text-align: center; }
    .redirect-card h1 { margin: 0 0 12px; color: #e11b22; font-size: clamp(2rem, 4vw, 3rem); }
    .redirect-card p { margin: 0 0 20px; color: #555; line-height: 1.6; }
    .redirect-actions { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; }
    .redirect-actions a { display: inline-block; padding: 12px 18px; border-radius: 999px; text-decoration: none; font-weight: 700; }
    .redirect-actions .primary { background: #e11b22; color: #fff; }
    .redirect-actions .secondary { border: 1px solid #ddd; color: #222; }
  </style>
</head>

  <main class="redirect-page">
    <section class="redirect-card">
      <h1>Modular Kitchen</h1>
      <p>This page is being restored. You will be redirected to the main site in a moment.</p>
      <div class="redirect-actions">
        <a class="primary" href="../index.html">Go to Home</a>

    </section>
